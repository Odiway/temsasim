kind: vehicle
name: City Bus 12m BE
variant: 350 kWh / resistive heating
description: >
  Identical to citybus_12m_be in every respect except the cabin heater. This
  pair exists to be run against each other on the same winter route: the whole
  argument for the cost and complexity of a heat pump is the gap between them,
  and it is a gap you can put a number on. PLACEHOLDER components throughout.

chassis: chassis/citybus_12m.yaml
driveline: driveline/direct_drive_6r2.yaml
motor: motor/central_250kw_pmsm.yaml
battery: battery/nmc_350kwh.yaml
hvac: hvac/resistive_30kw.yaml          # <- the only difference
auxiliaries: auxiliary/citybus_standard.yaml
aging: aging/generic_nmc.yaml

seats: 28
standees: 60

control:
  regen_enabled: true
  max_regen_decel_mps2: 1.2
  regen_blend_fraction: 0.95
  min_regen_speed_mps: 1.4
  soc_start: 0.95
  soc_target_min: 0.20
  cabin_preconditioned: true
  pack_preconditioned: false
