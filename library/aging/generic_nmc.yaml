description: >
  LITERATURE COEFFICIENTS, NOT CALIBRATED TO ANY TEMSA CELL.
  The functional form follows Wang et al., J. Power Sources 196 (2011)
  3942-3948. The form transfers between cells; the coefficients do not.

  Until these are fitted to your supplier's cycle-life and storage data, treat
  every year-N number this model produces as a sensitivity study, not a
  prediction, and never put one in a warranty document.

