  gece_gidis_2: {direction: gidis, night: true, ambient_c: 24.5, wind_mps: 1.1, wind_dir: D>B, humidity_pct: 58.3, pressure_hpa: 1006.0, fuel_device_l: 10.71, display_l100: 22.0}
  gece_gidis_3: {direction: gidis, night: true, ambient_c: 23.5, wind_mps: 0.9, wind_dir: D>B, humidity_pct: 65.9, pressure_hpa: 1006.4, fuel_device_l: 10.72, display_l100: 22.0}
