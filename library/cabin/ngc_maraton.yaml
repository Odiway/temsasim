notes: >
  Katman ve malzeme değerleri CFD raporundan; yüzey alanları KABUL (CAD'den ölçülmeli). Güneş yükü
  ASHRAE açık gök modeli (CFD'de Fluent solar calculator); aracın yönü raporda yok, 90° (doğu) kabul edildi.
  İç yüzey ısı taşınım katsayısı 3 W/m²K yalnızca taşınım (yüzeyler arası ışınım CFD'de çözülür, burada yok).
  Koltuk ve iç donanım kütlesi 200 kg, temas alanı 80 m², yolcu sayısı 50 kalibrasyon KABULÜ.
  Doğrulama: ortalama hacim sıcaklığı CFD'ye 10/20/30/40 dk'da ±3 °C (RMSE ≈ 2,4 °C); 20–40. dk'da
  model 2,5–2,7 °C daha sıcak. Ölçülmüş alanlar ve araç yönü girildiğinde yeniden kalibre edin.
