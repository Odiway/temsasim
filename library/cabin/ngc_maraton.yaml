description: >
  Kabin 55 °C'ye ısınmış (soak), dış hava 40 °C, Adana 200. gün 15:00 güneşi; 12 A/C üfleyici
  (6×0,154 + 6×0,15 kg/s) ve 0,1 kg/s buz çözücü, üfleme sıcaklığı Maraton A/C testinden
  (OA12425, OA16706); her yolcu 100 W; dış yüzeylerde 30 W/m²K. CFD sonucu: ortalama
  22 °C @ 40 dk; kabul: baş seviyesi < 31 °C @ 30 dk, < 29 °C @ 45 dk, bölgeler arası ΔT < 3 °C.
